name: JetWIFI
options:
  bundleIdPrefix: com.jetkyy
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  JetWIFI:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jetkyy.jetwifi
        PRODUCT_NAME: JetWIFI
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: JetWIFI
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: "JetWIFI scans your local network to discover the devices connected to it so you can identify and manage them through your own router."
        NSBonjourServices:
          - "_http._tcp"
          - "_https._tcp"
          - "_airplay._tcp"
          - "_raop._tcp"
          - "_companion-link._tcp"
          - "_googlecast._tcp"
          - "_ipp._tcp"
          - "_ipps._tcp"
          - "_ssh._tcp"
          - "_smb._tcp"
          - "_afpovertcp._tcp"
          - "_homekit._tcp"
          - "_spotify-connect._tcp"
